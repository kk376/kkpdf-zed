name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test & Lint Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-cargo

      - name: Rustfmt & Doc Check
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo fmt --check
          cargo doc --no-deps --all-features

      - name: Lint helper scripts
        if: matrix.os == 'ubuntu-latest'
        run: |
          command -v shellcheck >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y shellcheck)
          shellcheck scripts/download_pdfium.sh

      - name: Cache prebuilt Pdfium library
        id: cache-pdfium
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/lib
          key: pdfium-${{ matrix.os }}-${{ hashFiles('scripts/download_pdfium.sh') }}

      - name: Download prebuilt Pdfium dynamic library
        if: steps.cache-pdfium.outputs.cache-hit != 'true'
        run: bash scripts/download_pdfium.sh "${{ github.workspace }}/lib"

      - name: Clippy Audit
        env:
          PDFIUM_LIB_DIR: "${{ github.workspace }}/lib"
        run: cargo clippy --all-targets -- -D warnings

      - name: Test Suite (Native Pdfium Rendering)
        env:
          PDFIUM_LIB_DIR: "${{ github.workspace }}/lib"
        run: cargo test --all-targets -- --nocapture

      - name: Test Headless Mock Fallback (No Native Library)
        if: matrix.os == 'ubuntu-latest'
        env:
          PDFIUM_MOCK_FALLBACK: "1"
        run: cargo test --all-targets

      - name: Run Standalone Benchmark Runner
        env:
          PDFIUM_LIB_DIR: "${{ github.workspace }}/lib"
        run: cargo run --example viewer

      - name: Release Build Check
        if: matrix.os == 'ubuntu-latest'
        env:
          PDFIUM_LIB_DIR: "${{ github.workspace }}/lib"
        run: cargo build --release --all-targets

  msrv:
    name: MSRV Verification (1.88.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.88.0"

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-cargo

      - name: Verify MSRV check
        run: cargo check --all-targets --all-features

  security-audit:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run cargo audit
        run: cargo audit

  deny:
    name: Supply-Chain & License Governance (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
