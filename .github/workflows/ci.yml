name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test & Lint Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rustfmt Check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Download prebuilt Pdfium dynamic library
        run: bash scripts/download_pdfium.sh "${{ github.workspace }}/lib"

      - name: Clippy Audit
        env:
          PDFIUM_LIB_DIR: "${{ github.workspace }}/lib"
        run: cargo clippy --all-targets -- -D warnings

      - name: Test Suite (Native Pdfium Rendering)
        env:
          PDFIUM_LIB_DIR: "${{ github.workspace }}/lib"
        run: cargo test --all-targets -- --nocapture

      - name: Run Standalone Benchmark Runner
        env:
          PDFIUM_LIB_DIR: "${{ github.workspace }}/lib"
        run: cargo run --example viewer

  security-audit:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
