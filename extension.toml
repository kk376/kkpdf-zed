# ==============================================================================
# DOCUMENTATION STUB ONLY: NOT A FUNCTIONING EXTENSION MANIFEST
# ==============================================================================
# Zed's WebAssembly extension loader (WASM / WASI) currently only supports:
#   - Language Servers (LSP)
#   - Debug Adapters (DAP)
#   - Slash Commands (AI Context)
#   - Model Context Protocol (MCP) Servers
#   - Syntax Themes & Tree-sitter Grammars
#
# Zed extensions CANNOT currently render custom UI components, tabs, or GPUI
# canvas elements. This crate (`kkpdf-zed`) is a native workspace engine and
# GPUI Item implementation intended for upstream integration into Zed core or
# custom editor builds.
#
# This file records the metadata identity for a future upstream extension RFC.
# ==============================================================================

