[package]
name = "kkpdf-zed"
version = "0.1.0"
edition = "2021"
authors = ["Kushagra Kumar <kkushagra86@gmail.com>"]
license = "Apache-2.0 OR GPL-3.0-or-later"
description = "High-performance native PDF viewing engine and GPUI workspace item for Zed Editor"
repository = "https://github.com/kk376/kkpdf-zed"
readme = "README.md"

[dependencies]
anyhow = "1.0"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
schemars = "0.8"
pdfium-render = { version = "0.8", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3.10"
serde_json = "1.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
redundant_clone = "deny"
