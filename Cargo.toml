[package]
name = "kkpdf-zed"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Kushagra Kumar <kkushagra86@gmail.com>"]
license = "Apache-2.0 OR GPL-3.0-or-later"
description = "Headless PDF rendering engine, cache, and viewer state library using Pdfium"
repository = "https://github.com/kk376/kkpdf-zed"
readme = "README.md"
exclude = [".github/"]

[dependencies]
anyhow = "1.0"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
pdfium-render = "0.9"

[dev-dependencies]
tempfile = "3.27"
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
redundant_clone = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
